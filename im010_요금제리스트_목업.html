<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>im010 요금제 리스트 목업</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  :root {
    --coral: #FA5A47; --coral-dark: #D9432F; --coral-tint: #FFF1EE;
    --navy: #1F2430; --gray-700: #4B5262; --gray-500: #8A8F9C; --gray-400: #A9ADB6; --gray-200: #E9E7E3; --gray-100: #F4F5F7;
    --bg: #F7F8FA; --white: #fff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Pretendard', -apple-system, sans-serif; background: var(--bg); color: var(--navy); -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; cursor: pointer; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 24px; }

  .note { background: var(--navy); color: #fff; font-size: 13px; padding: 10px 0; }
  .note b { color: #FFB020; }

  .head { padding: 40px 0 18px; }
  .head h1 { font-size: 28px; font-weight: 800; letter-spacing: -.5px; }
  .head p { color: var(--gray-700); margin-top: 6px; }
  .jump { display: flex; gap: 8px; flex-wrap: wrap; margin: 18px 0 8px; }
  .jump a { font-size: 14px; font-weight: 600; padding: 8px 14px; border-radius: 999px; background: var(--white); border: 1px solid var(--gray-200); color: var(--gray-700); }
  .jump a:hover { border-color: var(--navy); color: var(--navy); }

  /* 제휴사 묶음 */
  .partner { padding: 26px 0 8px; scroll-margin-top: 10px; }
  .partner-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .partner-head h2 { display: flex; align-items: center; gap: 10px; font-size: 19px; font-weight: 800; }
  .partner-head h2 small { font-size: 13px; font-weight: 500; color: var(--gray-500); }
  .partner-head .all { font-size: 14px; font-weight: 600; color: var(--gray-700); }
  .partner-head .all:hover { color: var(--coral-dark); }

  /* 브랜드 표시 (로고 이미지 자리) */
  .brand { display: inline-flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 800; letter-spacing: -.3px; }
  .brand i { width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; font-style: normal; font-size: 12px; font-weight: 900; }

  /* 요금제 카드 (참고 이미지): 위 정보 영역 + 점선 + 아래 동작 영역. 제휴사마다 2개를 한 줄에 */
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: start; }
  .plan { display: flex; flex-direction: column; background: var(--white); border-radius: 18px; box-shadow: 0 2px 10px rgba(31,36,48,.06); overflow: hidden; transition: box-shadow .15s, transform .15s; }
  .plan:hover { box-shadow: 0 10px 26px rgba(31,36,48,.10); transform: translateY(-2px); }
  .plan-main { display: flex; flex-direction: column; gap: 6px; padding: 24px 28px 20px; cursor: pointer; }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 6px; }
  .top-left { display: flex; align-items: center; gap: 10px; min-width: 0; white-space: nowrap; }
  .top-left .sep { width: 1px; height: 14px; background: var(--gray-200); }
  .net { font-size: 13px; color: var(--gray-700); font-weight: 500; }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .badge { font-size: 12px; font-weight: 700; padding: 4px 8px; border-radius: 7px; white-space: nowrap; }
  .badge.coral { background: #FDEBDD; color: #D2621B; }
  .badge.navy { background: #EBEEFA; color: #2440A8; }
  .badge.pink { background: #FFE9F3; color: #E0368A; }
  .badge.green { background: #E6F6EC; color: #1E8E4E; }

  .name { font-size: 14px; color: var(--gray-500); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .headline { font-size: 21px; font-weight: 800; letter-spacing: -.5px; display: flex; align-items: center; gap: 6px; }
  .q { flex: none; width: 17px; height: 17px; border-radius: 50%; border: 1.5px solid var(--gray-400); color: var(--gray-400); font-size: 11px; font-weight: 700; display: inline-grid; place-items: center; }
  .specs { display: flex; gap: 16px; margin-top: 2px; color: var(--gray-700); font-size: 14px; }
  .specs span { display: inline-flex; align-items: center; gap: 5px; }
  .specs svg { width: 15px; height: 15px; fill: var(--gray-700); }

  /* 요금: 카드 아래쪽 한 줄 (월 요금 왼쪽 · 할인 후 요금 오른쪽) */
  .price { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--gray-100); }
  .price b { font-size: 23px; font-weight: 800; letter-spacing: -.5px; display: inline-flex; align-items: center; gap: 6px; }
  .price p { font-size: 13px; color: var(--gray-500); white-space: nowrap; }
  .price .keep { color: var(--gray-500); }

  .plan-foot { position: relative; display: flex; justify-content: flex-end; align-items: center; gap: 10px; padding: 14px 28px 16px; }
  .plan-foot::before { content: ''; position: absolute; top: 0; left: 24px; right: 24px; border-top: 1.5px dashed var(--gray-200); }
  .save { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; background: none; border: none; color: var(--navy); white-space: nowrap; }
  .save em { font-style: normal; color: #E8403A; }
  .save .arrow { color: var(--gray-400); transition: transform .15s; }
  .plan.open .save .arrow { transform: rotate(180deg); }
  .go { font-size: 15px; font-weight: 700; color: var(--white); background: var(--coral); border-radius: 999px; padding: 9px 18px; }
  .go:hover { background: var(--coral-dark); }

  .more { display: none; padding: 0 28px 20px; }
  .plan.open .more { display: block; }
  .more table { width: 100%; border-collapse: collapse; font-size: 14px; background: var(--gray-100); border-radius: 12px; overflow: hidden; }
  .more th, .more td { padding: 10px 14px; text-align: left; }
  .more th { color: var(--gray-500); font-weight: 600; width: 120px; }
  .more td.r { text-align: right; }
  .more .cta { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
  .ghost { font-size: 14px; font-weight: 700; padding: 9px 16px; border-radius: 999px; border: 1px solid var(--gray-200); background: var(--white); }

  .example { font-size: 11px; font-weight: 700; color: var(--gray-500); border: 1px dashed var(--gray-400); border-radius: 6px; padding: 1px 6px; }

  @media (max-width: 760px) {
    .wrap { padding: 0 16px; }
    .pair { grid-template-columns: 1fr; gap: 14px; }
    .plan-main { padding: 20px 20px 16px; }
    .top { flex-direction: column; align-items: flex-start; }
    .badges { justify-content: flex-start; }
    .headline { font-size: 19px; }
    .specs { gap: 12px; flex-wrap: wrap; }
    .plan-foot { padding: 12px 20px 14px; flex-wrap: wrap; }
    .plan-foot::before { left: 16px; right: 16px; }
    .more { padding: 0 20px 18px; }
  }
</style>
</head>
<body>

<div class="note"><div class="wrap">목업 · 요금제 리스트 (제휴사별 2개씩). 값은 로컬 DB 수집값(2026-10-16), <b>예시</b> 표시는 수집값이 1개뿐이라 채운 예시 · 평점 · 제휴 혜택은 데이터가 없어 넣지 않음</div></div>

<main class="wrap">
  <div class="head">
    <h1>제휴사별 요금제</h1>
    <p>7개 제휴사 요금제를 월 요금이 낮은 순으로 2개씩 모았어요</p>
    <nav class="jump" id="jump" aria-label="제휴사 바로가기"></nav>
  </div>
  <div id="list"></div>
</main>


<script>
  // 로컬 DB 수집값 (2026-10-16). ex = 예시
  const PARTNERS = [
    { code: 'mv', name: '마블링',     bg: '#FFE9E5', fg: '#D9432F' },
    { code: 'nt', name: '토리모바일', bg: '#E6F0FF', fg: '#2158C7' },
    { code: 'id', name: '위너스텔',   bg: '#E9F8EE', fg: '#1E9E52' },
    { code: 'sg', name: '슈가모바일', bg: '#FFE4EC', fg: '#D6336C' },
    { code: 'im', name: '인스모바일', bg: '#FFF3D6', fg: '#B3790B' },
    { code: 'jt', name: '조이M',      bg: '#F1E9FF', fg: '#6C39CC' },
    { code: 'sw', name: '시월모바일', bg: '#FDECC8', fg: '#B26A00' },
  ]
  const PLANS = {
    mv: [
      { name: '마블링 복지 1GB', data: '1GB', qos: null, voice: '100분', sms: '50건', net: 'LG U+', gen: 'LTE', price: 2200, months: 6, after: 3300 },
      { name: '마블링 복지 1GB + 1Mbps', data: '1GB', qos: '1Mbps', voice: '100분', sms: '100건', net: 'LG U+', gen: 'LTE', price: 6600, months: 6, after: 9900 },
    ],
    nt: [
      { name: '토리 통화기본 7GB + 7개월', data: '7GB', qos: '1Mbps', voice: '무제한', sms: '무제한', net: 'LG U+', gen: 'LTE', price: 4400, months: 7, after: 19800 },
      { name: '토리 통화기본10GB + 7개월', data: '10GB', qos: '1Mbps', voice: '무제한', sms: '무제한', net: 'LG U+', gen: 'LTE', price: 6600, months: 7, after: 22000 },
    ],
    id: [
      { name: '데이터 200MB', data: '200MB', qos: null, voice: '기본제공', sms: '기본제공', net: 'LG U+', gen: 'LTE', price: 4900 },
      { name: '데이터 무제한', data: '무제한', qos: null, voice: '기본제공', sms: '기본제공', net: 'LG U+', gen: '5G', price: 23000 },
    ],
    sg: [
      { name: '데이터 30GB', data: '30GB', qos: null, voice: '기본제공', sms: '기본제공', net: 'KT', gen: '5G', price: 15400 },
      { name: '슈가 통화기본 11GB + 매일 2GB', data: '11GB + 매일 2GB', qos: '3Mbps', voice: '기본제공', sms: '기본제공', net: 'KT', gen: 'LTE', price: 9900, months: 7, after: 33000, ex: true },
    ],
    im: [
      { name: '가벼운 3GB', data: '3GB', qos: null, voice: '기본제공', sms: '기본제공', net: 'LG U+', gen: 'LTE', price: 8900 },
      { name: '데이터 15GB', data: '15GB', qos: null, voice: '기본제공', sms: '기본제공', net: 'LG U+', gen: 'LTE', price: 13200 },
    ],
    jt: [
      { name: '6GB + 매일 1GB', data: '6GB + 매일 1GB', qos: '1Mbps', voice: '기본제공', sms: '기본제공', net: 'SKT', gen: 'LTE', price: 12900 },
      { name: '무제한 요금제', data: '무제한', qos: null, voice: '기본제공', sms: '기본제공', net: 'KT', gen: '5G', price: 24900 },
    ],
    sw: [
      { name: '시월 300분 6GB', data: '6GB', qos: '1Mbps', voice: '300분', sms: '200건', net: 'SKT', gen: 'LTE', price: 8800, months: 6, after: 29700, ex: true },
      { name: '데이터 50GB', data: '50GB', qos: '3Mbps', voice: '기본제공', sms: '기본제공', net: 'SKT', gen: '5G', price: 17900 },
    ],
  }

  const won = (n) => n.toLocaleString('ko-KR')
  const ICON = {
    call: '<svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>',
    sms: '<svg viewBox="0 0 24 24"><path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm0 4.2V18h16V8.2l-8 5-8-5zM4.5 6l7.5 4.7L19.5 6z"/></svg>',
    net: '<svg viewBox="0 0 24 24"><rect x="4" y="14" width="3.2" height="6" rx="1"/><rect x="10.4" y="9" width="3.2" height="11" rx="1"/><rect x="16.8" y="4" width="3.2" height="16" rx="1"/></svg>',
  }

  function badges(p) {
    const out = []
    if (p.months) out.push(['coral', `${p.months}개월 할인`])
    if (p.voice === '무제한' || p.voice === '기본제공') out.push(['navy', '통화 무제한'])
    if (p.gen === '5G') out.push(['pink', '5G'])
    if (p.data.includes('무제한')) out.push(['green', '데이터 무제한'])
    return out.slice(0, 2)
  }

  function card(partner, p, i) {
    const headline = p.data.includes('무제한') ? '데이터 무제한' : `월 ${p.data}${p.qos ? ' + ' + p.qos : ''}`
    const saved = p.months ? (p.after - p.price) * p.months : 0
    const id = `${partner.code}-${i}`
    return `
    <article class="plan" id="${id}">
      <div class="plan-main" role="button" tabindex="0" aria-label="${partner.name} ${p.name} 자세히">
        <div class="top">
          <div class="top-left">
            <span class="brand" style="color:${partner.fg}"><i style="background:${partner.bg};color:${partner.fg}">${partner.name[0]}</i>${partner.name}</span>
            <span class="sep"></span>
            <span class="net">${p.net} · ${p.gen}</span>
            ${p.ex ? '<span class="example">예시</span>' : ''}
          </div>
          <div class="badges">${badges(p).map(([t, l]) => `<span class="badge ${t}">${l}</span>`).join('')}</div>
        </div>
        <div>
          <p class="name">${p.name}</p>
          <p class="headline">${headline} <span class="q" title="데이터를 다 쓰면 ${p.qos ?? '속도 제한 없음 정보 없음'}">?</span></p>
          <p class="specs"><span>${ICON.call}${p.voice}</span><span>${ICON.sms}${p.sms}</span><span>${ICON.net}${p.gen}</span></p>
        </div>
        <div class="price">
          <b>월 ${won(p.price)}원 <span class="q" title="${p.months ? `${p.months}개월 동안 할인된 요금` : '할인 없이 같은 요금'}">?</span></b>
          <p>${p.months ? `${p.months}개월 이후 ${won(p.after)}원` : '<span class="keep">할인 기간 없음</span>'}</p>
        </div>
      </div>
      <div class="plan-foot">
        ${saved
          ? `<button type="button" class="save" data-toggle aria-expanded="false">할인으로 최대 <em>${won(saved)}원</em> 아껴요 <span class="arrow">⌄</span></button>`
          : `<button type="button" class="save" data-toggle aria-expanded="false">요금 자세히 <span class="arrow">⌄</span></button>`}
      </div>
      <div class="more">
        <table>
          <tr><th>월 요금</th><td>${won(p.price)}원${p.months ? ` (${p.months}개월)` : ''}</td><th>이후 요금</th><td>${p.months ? won(p.after) + '원' : '같음'}</td></tr>
          <tr><th>데이터</th><td>${p.data}</td><th>다 쓰면</th><td>${p.qos ?? '–'}</td></tr>
          <tr><th>통화 · 문자</th><td>${p.voice} · ${p.sms}</td><th>망</th><td>${p.net} ${p.gen}</td></tr>
          ${p.months ? `<tr><th>2년 총 요금</th><td colspan="3">${won(p.price * p.months + p.after * (24 - p.months))}원 (할인 ${p.months}개월 + 이후 ${24 - p.months}개월)</td></tr>` : `<tr><th>2년 총 요금</th><td colspan="3">${won(p.price * 24)}원</td></tr>`}
        </table>
        <div class="cta"><a class="ghost" href="#">요금제 자세히 보기</a><a class="go" href="#">개통하기 ↗</a></div>
      </div>
    </article>`
  }

  document.getElementById('jump').innerHTML = PARTNERS.map((p) => `<a href="#p-${p.code}">${p.name}</a>`).join('')
  document.getElementById('list').innerHTML = PARTNERS.map((pt) => `
    <section class="partner" id="p-${pt.code}">
      <div class="partner-head">
        <h2><span class="brand" style="color:${pt.fg}"><i style="background:${pt.bg};color:${pt.fg}">${pt.name[0]}</i>${pt.name}</span></h2>
        <a class="all" href="#">${pt.name} 요금제 전체 보기 ›</a>
      </div>
      <div class="pair">${PLANS[pt.code].map((p, i) => card(pt, p, i)).join('')}</div>
    </section>`).join('')

  // 동작: 카드 · 아래 문구를 누르면 상세 표 펼치기
  document.getElementById('list').addEventListener('click', (e) => {
    const plan = e.target.closest('.plan')
    if (!plan) return
    if (e.target.closest('[data-toggle]') || e.target.closest('.plan-main')) {
      const open = plan.classList.toggle('open')
      plan.querySelector('[data-toggle]').setAttribute('aria-expanded', open)
    }
  })
  document.getElementById('list').addEventListener('keydown', (e) => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('plan-main')) { e.preventDefault(); e.target.click() }
  })
</script>
</body>
</html>
