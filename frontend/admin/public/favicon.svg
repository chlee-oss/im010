<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- im010 로고 표식(BrandMark)의 탭 아이콘판: 맞닿은 두 원. 16~32px 에서 또렷하도록 정사각형에 꽉 채우고 선을 굵게 -->
  <style>
    .primary { stroke: #1E5BD8; }
    .light { stroke: #7FB0FF; }
    /* 어두운 탭 배경에서는 파란 원을 밝혀 대비를 확보한다 */
    @media (prefers-color-scheme: dark) {
      .primary { stroke: #5C8FF2; }
    }
  </style>
  <circle class="primary" cx="10" cy="16" r="8" fill="none" stroke-width="3.5" />
  <circle class="light" cx="22" cy="16" r="8" fill="none" stroke-width="3.5" />
</svg>
