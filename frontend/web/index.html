<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 탭 아이콘: SVG 를 지원하면 SVG, 구형 브라우저는 ICO(16 · 32px). iOS 홈 화면은 흰 배경 180px -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 아래 title · description · og:title/description/url/type/image 는 페이지마다 scripts/prerender.mjs 가 바꿔 넣는다 -->
    <title>im010 — 알뜰폰 요금비교</title>
    <meta name="description" content="7개 제휴사 알뜰폰 후불 · 선불 요금제와 인터넷 상품을 한눈에 비교하고 최저가 요금제를 찾아보세요." />
    <meta property="og:site_name" content="im010" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="im010 — 알뜰폰 요금비교" />
    <meta property="og:description" content="7개 제휴사 알뜰폰 후불 · 선불 요금제와 인터넷 상품을 한눈에 비교하고 최저가 요금제를 찾아보세요." />
    <!-- 기본 공유 이미지 1200x630 (public/og-default.png — 디자인 확정본으로 같은 이름 교체) -->
    <meta property="og:image" content="https://www.im010.co.kr/og-default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
