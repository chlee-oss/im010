server:
  port: 8081
  forward-headers-strategy: framework   # nginx 뒤에서 X-Forwarded-* 사용
  servlet:
    session:
      timeout: 30m                       # CM-01: 30분 동안 동작이 없으면 로그아웃
      cookie:
        name: IM010ADMIN
        http-only: true
        same-site: strict
        secure: ${IM010_ADMIN_SECURE_COOKIE:true}

spring:
  application:
    name: im010-admin
  servlet:
    multipart:
      max-file-size: 5MB                 # 알뜰AI 이미지 업로드
      max-request-size: 6MB
  datasource:
    url: ${IM010_DB_URL:jdbc:postgresql://localhost:5432/im010}
    username: ${IM010_DB_USER:im010}
    password: ${IM010_DB_PASSWORD:}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    arg-name-based-constructor-auto-mapping: true

im010:
  admin:
    bootstrap-login-id: ${IM010_ADMIN_BOOTSTRAP_LOGIN_ID:admin}
    bootstrap-password: ${IM010_ADMIN_BOOTSTRAP_PASSWORD:}
  upload:
    dir: ${IM010_UPLOAD_DIR:/opt/im010/uploads}   # 알뜰AI 이미지 (api 와 같은 경로)

management:
  endpoints:
    web:
      exposure:
        include: health
