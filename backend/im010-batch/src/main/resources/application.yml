spring:
  application:
    name: im010-batch
  main:
    web-application-type: none
  datasource:
    url: ${IM010_DB_URL:jdbc:postgresql://localhost:5432/im010}
    username: ${IM010_DB_USER:im010}
    password: ${IM010_DB_PASSWORD:}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    arg-name-based-constructor-auto-mapping: true

im010:
  crawl:
    scheduler-enabled: true
    request-delay: 3s
    timeout: 20s
    zone: Asia/Seoul
