# 로컬 개발용. 스케줄은 끄고, 필요할 때 run-now 로 수집한다:
#   ./gradlew :im010-batch:bootRun --args='--spring.profiles.active=local --im010.crawl.run-now=mv,nt'
spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/im010
    username: im010
    password: im010_local

im010:
  crawl:
    scheduler-enabled: false
  # 대시보드 집계는 로컬에서도 운영과 같이 1시간마다 돈다 (시작 2분 뒤 첫 집계 — 바로 보려면 batch 를 다시 시작)

logging:
  level:
    kr.co.im010: DEBUG
