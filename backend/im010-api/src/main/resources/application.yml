server:
  port: 8080
  address: ${IM010_BIND_ADDRESS:127.0.0.1}   # nginx 뒤에서만 받는다 (외부에서 8080 · 8081 직접 접속 차단)
  forward-headers-strategy: framework   # nginx 뒤에서 X-Forwarded-* 사용

spring:
  application:
    name: im010-api
  datasource:
    url: ${IM010_DB_URL:jdbc:postgresql://localhost:5432/im010}
    username: ${IM010_DB_USER:im010}
    password: ${IM010_DB_PASSWORD:}
  flyway:
    locations: classpath:db/migration
  task:
    execution:
      thread-name-prefix: im010-async-
      pool:
        core-size: 2
        max-size: 8
        queue-capacity: 1000

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    arg-name-based-constructor-auto-mapping: true

im010:
  front-base-url: ${IM010_FRONT_BASE_URL:http://localhost:5173}
  upload:
    dir: ${IM010_UPLOAD_DIR:/opt/im010/uploads}   # 알뜰AI 이미지 (/uploads/**)

management:
  endpoints:
    web:
      exposure:
        include: health,info
