# im010 백오피스 (Rocky Linux 9.7 · nginx) — /etc/nginx/conf.d/im010-admin.conf
# React 빌드 결과(frontend/admin/dist)를 정적으로 서비스하고, /admin/api 는 Spring Boot(im010-admin, 8081)로 넘긴다.
# 고객 화면과 다른 주소(admin.im010.co.kr)로 열고, 사내 IP 제한은 선택 (결정 #24 — 아래 allow/deny 주석 해제).

upstream im010_admin {
    server 127.0.0.1:8081;
    keepalive 8;
}

# 로그인 시도 제한 (IP당 분당 20회) — 계정 잠금(5회 실패 · 30분)과 함께 쓴다
limit_req_zone $binary_remote_addr zone=im010_admin_auth:10m rate=20r/m;

server {
    listen 80;
    server_name admin.im010.co.kr;
    # TLS 필수: 세션 쿠키가 Secure 라 HTTPS 에서만 로그인된다. 인증서 적용 후 443 서버로 옮긴다
    # return 301 https://$host$request_uri;

    # allow 203.0.113.0/24;   # 사내 IP (선택)
    # deny all;

    root /opt/im010/admin-web;    # frontend/admin/dist 배포 위치
    index index.html;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /admin/api/auth/ {
        limit_req zone=im010_admin_auth burst=10 nodelay;
        proxy_pass http://im010_admin;
        include /etc/nginx/conf.d/im010-proxy.inc;
    }

    location /admin/api/ {
        proxy_pass http://im010_admin;
        include /etc/nginx/conf.d/im010-proxy.inc;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location /actuator/ { return 404; }
}
