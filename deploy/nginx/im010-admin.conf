# im010 백오피스 (Rocky Linux 9.8 · nginx) — /etc/nginx/conf.d/im010-admin.conf
# React 빌드 결과(frontend/admin/dist)를 정적으로 서비스하고, /admin/api 는 Spring Boot(im010-admin, 8081)로 넘긴다.
# 백오피스는 관리자 브라우저 접속 전용 포트 7945(HTTPS)로만 연다. 80/443 에서는 admin 주소를 받지 않는다 (im010.conf 의 기본 서버가 끊음).
# 허용 IP 만 접속: firewalld rich rule(1차) + 아래 allow/deny(2차) + 앱의 사내 IP 제한(ST-02, 선택 · 3차).

upstream im010_admin {
    server 127.0.0.1:8081;
    keepalive 8;
}

# 로그인 시도 제한 (IP당 분당 20회) — 계정 잠금(5회 실패 · 30분)과 함께 쓴다
limit_req_zone $binary_remote_addr zone=im010_admin_auth:10m rate=20r/m;

server {
    listen 7945 ssl;
    http2 on;                # nginx 1.25.1+ 문법 (Rocky 9 AppStream nginx:1.26)
    server_name admin.im010.co.kr;

    # 세션 쿠키가 Secure 라 HTTPS 에서만 로그인된다
    ssl_certificate     /etc/pki/nginx/admin.im010.co.kr.crt;
    ssl_certificate_key /etc/pki/nginx/private/admin.im010.co.kr.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:im010_admin_ssl:5m;
    ssl_session_timeout 1h;

    # 7945 로 http:// 접속하면 https:// 로 다시 보낸다 (497 = HTTP 요청이 HTTPS 포트로 들어옴)
    error_page 497 =301 https://$host:7945$request_uri;

    # 7945 접속 허용 IP — 여기 없는 주소는 403.
    # iptables 허용 IP(Zabbix · 시간 서버 포함)는 모든 포트가 열려 있으므로, 백오피스는 여기서 관리자 IP로 한 번 더 좁힌다
    allow 61.111.2.99;
    allow 61.111.2.100;
    allow 58.120.97.201;      # 사내 IP (TC_Office)
    deny all;

    root /opt/im010/admin-web;    # frontend/admin/dist 배포 위치
    index index.html;
    client_max_body_size 5m;

    include /etc/nginx/conf.d/im010-admin-headers.inc;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /admin/api/auth/ {
        limit_req zone=im010_admin_auth burst=10 nodelay;
        proxy_pass http://im010_admin;
        include /etc/nginx/conf.d/im010-proxy.inc;
    }

    location /admin/api/ {
        proxy_pass http://im010_admin;
        include /etc/nginx/conf.d/im010-proxy.inc;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/conf.d/im010-admin-headers.inc;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/conf.d/im010-admin-headers.inc;
    }

    location /actuator/ { return 404; }
}
