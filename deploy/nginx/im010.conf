# im010 고객 화면 (Rocky Linux 9.7 · nginx) — /etc/nginx/conf.d/im010.conf
# React 빌드 결과(frontend/web/dist)를 정적으로 서비스하고, /api · /go 는 Spring Boot(im010-api)로 넘긴다.
# 백오피스(im010-admin, 8081)는 이 서버 블록에 넣지 않는다 — im010-admin.conf (별도 주소).

upstream im010_api {
    server 127.0.0.1:8080;
    keepalive 16;
}

# /go 포워딩 남용 방지 (IP당 초당 5회, 순간 10회까지)
limit_req_zone $binary_remote_addr zone=im010_go:10m rate=5r/s;

server {
    listen 80;
    server_name www.im010.co.kr;
    # TLS 적용 후 443으로 이동시키고 아래 블록을 443 서버로 옮긴다
    # return 301 https://$host$request_uri;

    root /opt/im010/web;          # frontend/web/dist 배포 위치
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://im010_api;
        include /etc/nginx/conf.d/im010-proxy.inc;
    }

    location /go/ {
        limit_req zone=im010_go burst=10 nodelay;
        proxy_pass http://im010_api;
        include /etc/nginx/conf.d/im010-proxy.inc;
    }

    # 해시가 붙은 빌드 파일은 오래 캐시
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: 없는 경로는 index.html (React Router가 처리)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # actuator 는 외부에 열지 않는다
    location /actuator/ { return 404; }
}
