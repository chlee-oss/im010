# im010 고객 화면 (Rocky Linux 9.8 · nginx) — /etc/nginx/conf.d/im010.conf
# React 빌드 결과(frontend/web/dist, 경로별 미리 렌더링 HTML 포함)를 정적으로 서비스하고, /api · /go 는 Spring Boot(im010-api)로 넘긴다.
# 443 은 불특정 다수에게 공개한다. 80 은 iptables 로 외부에 닫혀 있다 (Let's Encrypt 발급 · 갱신 때만 1분 남짓 임시 개방).
# 백오피스(im010-admin, 8081)는 여기서 받지 않는다 — im010-admin.conf (7945 전용).

server_tokens off;

upstream im010_api {
    server 127.0.0.1:8080;
    keepalive 16;
}

# /go 포워딩 남용 방지 (IP당 초당 5회, 순간 10회까지)
limit_req_zone $binary_remote_addr zone=im010_go:10m rate=5r/s;

# 등록되지 않은 Host(IP 직접 접속, admin.im010.co.kr 등)는 응답 없이 끊는다
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}

server {
    listen 80;
    server_name www.im010.co.kr im010.co.kr;

    # Let's Encrypt 발급 · 갱신 확인 파일 (certbot --webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://www.im010.co.kr$request_uri;
    }
}

# 백오피스 주소는 80 에서 Let's Encrypt 확인 파일만 응답하고 나머지는 끊는다 (화면은 7945 전용)
server {
    listen 80;
    server_name admin.im010.co.kr;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / { return 444; }
}

# www 없는 주소(https://im010.co.kr)는 https://www.im010.co.kr 로 보낸다.
# 인증서(cert-name im010)에 im010.co.kr 이 들어 있어야 한다 (setup-letsencrypt.sh)
server {
    listen 443 ssl;
    http2 on;
    server_name im010.co.kr;

    ssl_certificate     /etc/pki/nginx/www.im010.co.kr.crt;
    ssl_certificate_key /etc/pki/nginx/private/www.im010.co.kr.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/conf.d/im010-headers.inc;

    return 301 https://www.im010.co.kr$request_uri;
}

server {
    listen 443 ssl;
    http2 on;                # nginx 1.25.1+ 문법 (Rocky 9 AppStream nginx:1.26)
    server_name www.im010.co.kr;

    ssl_certificate     /etc/pki/nginx/www.im010.co.kr.crt;
    ssl_certificate_key /etc/pki/nginx/private/www.im010.co.kr.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:im010_ssl:10m;
    ssl_session_timeout 1h;

    root /opt/im010/web;          # frontend/web/dist 배포 위치
    index index.html;
    client_max_body_size 1m;

    include /etc/nginx/conf.d/im010-headers.inc;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    location /api/ {
        proxy_pass http://im010_api;
        include /etc/nginx/conf.d/im010-proxy.inc;
    }

    location /go/ {
        limit_req zone=im010_go burst=10 nodelay;
        proxy_pass http://im010_api;
        include /etc/nginx/conf.d/im010-proxy.inc;
    }

    # 백오피스 API 는 이 주소로 열지 않는다
    location /admin/ { return 404; }

    # 알뜰AI 이미지 (백오피스에서 올린 jpg · png · webp · gif). 이미지 확장자만 내려주고, nosniff 로 다른 형식 해석을 막는다
    location /uploads/ {
        alias /opt/im010/uploads/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/conf.d/im010-headers.inc;
        location ~* \.(?!(jpe?g|png|webp|gif)$)[^.]+$ { return 404; }
    }

    # 해시가 붙은 빌드 파일은 오래 캐시
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/conf.d/im010-headers.inc;
    }

    # ── 화면 (미리 렌더링: frontend/web/scripts/prerender.mjs → dist/<경로>/index.html) ──
    # 미리 만든 HTML 이 있는 경로만 200. 없는 경로는 404.html(noindex + SPA)로 실제 404 를 준다.
    error_page 404 /404.html;

    location / {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "no-cache";
        include /etc/nginx/conf.d/im010-headers.inc;
    }

    location = /404.html {
        internal;
        add_header Cache-Control "no-cache";
        include /etc/nginx/conf.d/im010-headers.inc;
    }

    # 요금제 상세. 판매 종료(_gone/)는 410 + 종료 안내 화면(noindex, 비슷한 요금제 링크).
    # 빌드 뒤에 새로 게시된 요금제는 미리 만든 HTML 이 없으므로 SPA 틀(_shell.html, 200)로 연다.
    location ~ ^/plans/(\d+)/?$ {
        set $plan_id $1;
        error_page 410 /_gone/plans/$plan_id/index.html;
        if (-f $document_root/_gone/plans/$plan_id/index.html) { return 410; }
        try_files /plans/$plan_id/index.html /_shell.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/conf.d/im010-headers.inc;
    }

    # 알뜰AI 글 /ai/posts/{id}/{slug} — slug 는 보지 않는다 (canonical 이 정식 slug). 빌드 뒤 새 글은 SPA 틀(200)
    location ~ ^/ai/posts/(\d+)(/[^/]*)?/?$ {
        try_files /ai/posts/$1/index.html /_shell.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/conf.d/im010-headers.inc;
    }

    # 미리 렌더링 내부 파일은 주소로 직접 열지 않는다
    location ^~ /_gone/ {
        internal;
        add_header Cache-Control "no-cache";
        include /etc/nginx/conf.d/im010-headers.inc;
    }
    location = /_shell.html {
        internal;
        add_header Cache-Control "no-cache";
        include /etc/nginx/conf.d/im010-headers.inc;
    }

    location = /robots.txt {
        default_type text/plain;
        add_header Cache-Control "no-cache";
        include /etc/nginx/conf.d/im010-headers.inc;
    }

    # sitemap.xml 은 api 가 DB 기준으로 그때그때 만든다 (게시 · 판매 종료 즉시 반영, SitemapController)
    location = /sitemap.xml {
        proxy_pass http://im010_api;
        include /etc/nginx/conf.d/im010-proxy.inc;
    }

    # actuator 는 외부에 열지 않는다
    location /actuator/ { return 404; }
}
